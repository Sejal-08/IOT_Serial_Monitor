<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Sensor - Arduino</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-nav {
      position: fixed; top: 0; left: 0; width: 100%;
      height: 60px; background: var(--nav-bg);
      border-bottom: 1px solid var(--nav-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 1000;
    }
    .back-btn {
      color: var(--text-dim); text-decoration: none;
      font-family: var(--font-mono); font-size: 0.9rem;
      transition: color 0.3s;
    }
    .back-btn:hover { color: var(--accent-cyan); }
    
    .menu-container {
      margin: 100px auto 40px;
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
    }
    .menu-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .menu-header h1 {
      font-family: var(--font-sans);
      font-size: 2.5rem;
      color: var(--text-bright);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .sensor-card-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .sensor-card-btn:hover {
      transform: translateY(-5px);
      border-color: #60a5fa;
      box-shadow: 0 8px 15px rgba(96, 165, 250, 0.2);
    }
    .sensor-card-btn i {
      font-size: 3rem;
      color: #60a5fa;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }
    .sensor-card-btn:hover i {
      color: #93c5fd;
      text-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
    }
    .sensor-card-btn span {
      font-family: var(--font-sans);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-bright);
    }
  </style>
</head>
<body>
  <!-- Top Nav -->
  <div class="top-nav">
    <a href="login.html" class="back-btn"><i class="fas fa-arrow-left"></i> BACK</a>
    <div style="font-family: var(--font-sans); font-weight: 700; color: #fff; letter-spacing: 1px;">
      ARDUINO SENSORS
    </div>
    <div style="width: 60px;"></div> <!-- Spacer -->
  </div>

  <div class="menu-container">
    <div class="menu-header">
      <h1>Select Sensor</h1>
    </div>
    <div class="sensor-grid" id="sensor-grid">
      <!-- Generated by JS -->
    </div>
  </div>

  <script>
    const sensors = [
      { name: "Soil Spectra", protocol: "RS485", sensor: "Soil Sensor", icon: "fa-seedling" },
      { name: "Rain Gauge", protocol: "ADC", sensor: "Rain Gauge", icon: "fa-cloud-rain" },
      { name: "Radiation Shield", protocol: "I2C", sensor: "Weather Shield", icon: "fa-shield-halved" },
      { name: "Ultrasonic", protocol: "RS485", sensor: "Wind Sensor", icon: "fa-wind" },
      { name: "AHT20", protocol: "I2C", sensor: "AHT20", icon: "fa-temperature-quarter" },
      { name: "STTS751", protocol: "I2C", sensor: "STTS751", icon: "fa-temperature-half" },
      { name: "STS30", protocol: "I2C", sensor: "STS30", icon: "fa-temperature-three-quarters" },
      { name: "LIS3DH", protocol: "I2C", sensor: "LIS3DH", icon: "fa-cube" },
      { name: "LIS2DH", protocol: "I2C", sensor: "LIS2DH", icon: "fa-cubes" },
      { name: "Relay", protocol: "GPIO", sensor: "Relay", icon: "fa-toggle-on" },
      { name: "Buzzer", protocol: "GPIO", sensor: "Buzzer", icon: "fa-volume-up" },
      { name: "VCNL4040", protocol: "I2C", sensor: "VCNL4040", icon: "fa-sun" },
      { name: "VEML7700", protocol: "I2C", sensor: "VEML7700", icon: "fa-lightbulb" },
      { name: "Reed Switch", protocol: "GPIO", sensor: "Reed Switch", icon: "fa-magnet" },
      { name: "Hall Effect", protocol: "Analog", sensor: "Hall Sensor", icon: "fa-magnet" },
      { name: "IR", protocol: "Analog", sensor: "IR Sensor", icon: "fa-broadcast-tower" },
      { name: "SEN66", protocol: "I2C", sensor: "SEN66", icon: "fa-smog" }
    ];

    const grid = document.getElementById("sensor-grid");
    sensors.forEach(s => {
      const a = document.createElement("a");
      a.className = "sensor-card-btn";
      a.href = "arduino.html?sensor=" + encodeURIComponent(s.sensor) + "&protocol=" + encodeURIComponent(s.protocol);
      
      const i = document.createElement("i");
      i.className = "fas " + s.icon;
      
      const span = document.createElement("span");
      span.textContent = s.name;
      
      a.appendChild(i);
      a.appendChild(span);
      grid.appendChild(a);
    });
  </script>
</body>
</html>
