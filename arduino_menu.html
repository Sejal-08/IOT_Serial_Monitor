<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Sensor - Arduino</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', sans-serif;
    }
    .top-nav {
      position: fixed; top: 0; left: 0; width: 100%;
      height: 60px; background: var(--nav-bg);
      border-bottom: 1px solid var(--nav-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 1000;
    }
    .back-btn {
      color: var(--text-dim); text-decoration: none;
      font-family: var(--font-mono); font-size: 0.9rem;
      transition: color 0.3s;
    }
    .back-btn:hover { color: var(--accent-cyan); }
    
    .menu-container {
      margin: 100px auto 40px;
      width: 100%;
      max-width: 1400px;
      padding: 0 40px;
    }
    .menu-header {
      text-align: center;
      margin-bottom: 50px;
    }
    .menu-header h1 {
      font-family: var(--font-sans);
      font-size: 2.8rem;
      color: var(--text-bright);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }
    .sensor-card-btn {
      background: #18181b;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      border: 1px solid #27272a;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      align-items: stretch;
      padding: 0;
    }
    .sensor-card-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.5);
      border-color: #3f3f46;
    }
    .card-img-container {
      background: #8e959f;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .card-img-container img {
      width: auto;
      height: 160px;
      object-fit: contain;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
    }
    .card-img-container i {
      font-size: 6rem;
      color: #fff;
      opacity: 0.9;
    }
    .card-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-content h3 {
      font-family: 'Inter', sans-serif;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: left;
    }
    .card-content p {
      font-family: 'Inter', sans-serif;
      color: #a1a1aa;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 24px;
      text-align: left;
      flex-grow: 1;
    }
    .monitor-btn {
      background: #27272a;
      color: #e4e4e7;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 12px 0;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sensor-card-btn:hover .monitor-btn {
      background: #93c5fd;
      color: #1e1e24;
      border-color: #93c5fd;
    }
  </style>
</head>
<body>
  <!-- Top Nav -->
  <div class="top-nav">
    <a href="login.html" class="back-btn"><i class="fas fa-arrow-left"></i> BACK</a>
    <div style="font-family: var(--font-sans); font-weight: 700; color: #fff; letter-spacing: 1px;">
      ARDUINO SENSORS
    </div>
    <div style="width: 60px;"></div> <!-- Spacer -->
  </div>

  <div class="menu-container">
    <div class="menu-header">
      <h1>Select Sensor</h1>
    </div>
    <div class="sensor-grid" id="sensor-grid">
      <!-- Generated by JS -->
    </div>
  </div>

  <script>
    const sensors = [
      { name: "Soil Spectra", desc: "Soil sensing solution for agricultural parameter monitoring", protocol: "RS485", sensor: "Soil Sensor", icon: "fa-seedling", img: "images/soil.png" },
      { name: "Rain Gauge", desc: "Tipping Bucket Rain Gauge for precise rainfall measurement", protocol: "ADC", sensor: "Rain Gauge", icon: "fa-cloud-rain", img: "images/gauge.png" },
      { name: "Radiation Shield", desc: "Weather Shield for accurate outdoor environment sensing", protocol: "I2C", sensor: "Weather Shield", icon: "fa-shield-halved", img: "images/luxpressure.png" },
      { name: "Ultrasonic Anemometer", desc: "Ultrasonic Anemometer for precise wind speed and wind direction", protocol: "RS485", sensor: "Wind Sensor", icon: "fa-wind", img: "images/ultrasonic.png" },
      { name: "AHT20", desc: "High precision temperature and humidity sensor module", protocol: "I2C", sensor: "AHT20", icon: "fa-temperature-quarter" },
      { name: "STTS751", desc: "High accuracy digital temperature sensor", protocol: "I2C", sensor: "STTS751", icon: "fa-temperature-half", img: "images/stts751.png" },
      { name: "STS30", desc: "High accuracy digital temperature sensor", protocol: "I2C", sensor: "STS30", icon: "fa-temperature-three-quarters", img: "images/sts30.png" },
      { name: "LIS3DH", desc: "3-axis digital output accelerometer for motion detection", protocol: "I2C", sensor: "LIS3DH", icon: "fa-cube", img: "images/lis3dh.png" },
      { name: "LIS2DH", desc: "Ultra-low-power high-performance 3-axis accelerometer", protocol: "I2C", sensor: "LIS2DH", icon: "fa-cubes" },
      { name: "Relay", desc: "Electromechanical switch for controlling high power devices", protocol: "GPIO", sensor: "Relay", icon: "fa-toggle-on", img: "images/relay.png" },
      { name: "Buzzer", desc: "Audio signaling device for alarms and notifications", protocol: "GPIO", sensor: "Buzzer", icon: "fa-volume-up", img: "images/buzzer.png" },
      { name: "VCNL4040", desc: "Fully integrated proximity and ambient light sensor", protocol: "I2C", sensor: "VCNL4040", icon: "fa-sun" },
      { name: "VEML7700", desc: "High accuracy ambient light digital sensor", protocol: "I2C", sensor: "VEML7700", icon: "fa-lightbulb" },
      { name: "Reed Switch", desc: "Magnetic proximity switch for door and window monitoring", protocol: "GPIO", sensor: "Reed Switch", icon: "fa-magnet" },
      { name: "Hall Effect", desc: "Magnetic field sensor for position and proximity", protocol: "Analog", sensor: "Hall Sensor", icon: "fa-magnet", img: "images/halleffect.png" },
      { name: "IR", desc: "Infrared obstacle avoidance and motion detection sensor", protocol: "Analog", sensor: "IR Sensor", icon: "fa-broadcast-tower" },
      { name: "SEN66", desc: "Advanced particulate matter and environmental node", protocol: "I2C", sensor: "SEN66", icon: "fa-smog" }
    ];

    const grid = document.getElementById("sensor-grid");
    sensors.forEach(s => {
      const a = document.createElement("a");
      a.className = "sensor-card-btn";
      a.href = "javascript:void(0)";
      a.onclick = () => {
        localStorage.setItem("arduinoSensor", s.sensor);
        localStorage.setItem("arduinoProtocol", s.protocol);
        window.location.href = "arduino.html";
      };
      
      const imgContainer = document.createElement("div");
      imgContainer.className = "card-img-container";
      
      if (s.img) {
        const img = document.createElement("img");
        img.src = s.img;
        imgContainer.appendChild(img);
      } else {
        const i = document.createElement("i");
        i.className = "fas " + s.icon;
        imgContainer.appendChild(i);
      }
      
      const content = document.createElement("div");
      content.className = "card-content";
      
      const h3 = document.createElement("h3");
      h3.textContent = s.name;
      
      const p = document.createElement("p");
      p.textContent = s.desc;
      
      const btn = document.createElement("button");
      btn.className = "monitor-btn";
      btn.textContent = "MONITOR SENSOR";
      
      content.appendChild(h3);
      content.appendChild(p);
      content.appendChild(btn);
      
      a.appendChild(imgContainer);
      a.appendChild(content);
      
      grid.appendChild(a);
    });
  </script>
</body>
</html>
